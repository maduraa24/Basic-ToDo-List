<!DOCTYPE html>
<html>
  <head>
    <title>
      To Do List
    </title>
    <link rel="stylesheet" href="todo.css">
  </head>

  <body>
    <div class="container">
         
      <p class="title">Simple Todo List</p>

      <div class="todo-input-grid">
        <input placeholder="Todo name"
          class="js-name-input name-input">
          <input type="date"
            class="js-date date-input">
        <button class="add-button js-add">Add</button>
      </div>

      <div class="js-todo-list todo-grid"></div>
    </div>

    <script src="todo.js"></script>

  </body>
</html>
